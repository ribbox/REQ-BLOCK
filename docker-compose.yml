# Full stack: API + static web UI (nginx)
#
#   docker compose up -d --build
#
# UI:  http://localhost:8088/
# API: http://localhost:8088/api/
#
# Host ports used: 8088 only (does NOT bind 8080)
#
# Settings → Remote sync URL = http://localhost:8088/api/

services:
  api:
    build: ./backend
    image: requirement-scratch-api:latest
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
      DATA_FILE: "/data/project.json"
      CORS_ORIGIN: "*"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
    volumes:
      - requirements_data:/data
    expose:
      - "8090"

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./requirement_scratch.html:/usr/share/nginx/html/index.html:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  requirements_data:
