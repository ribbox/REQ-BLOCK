# Full stack: API + static web UI (nginx)
#
#   docker compose up -d --build
#
# UI:  http://localhost:8088/
# API: http://localhost:8088/api/   (proxied to the backend)
#
# In the web app Settings set:
#   Remote sync URL = http://localhost:8088/api/
#   (or https://your-domain/api/ in production)

services:
  api:
    build: ./backend
    image: requirement-scratch-api:latest
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_FILE: "/data/project.json"
      CORS_ORIGIN: "*"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
    volumes:
      - requirements_data:/data
    # Not published externally – only via nginx
    expose:
      - "8080"

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./requirement_scratch.html:/usr/share/nginx/html/index.html:ro
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  requirements_data:
