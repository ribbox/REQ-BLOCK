server {
    listen 80;
    server_name _;

    # Critical behind Caddy path prefix (/req-block): never emit absolute redirects
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # Docker embedded DNS — resolve "api" at request time (avoids startup crash)
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Variable proxy_pass forces runtime DNS lookup of service name "api"
    location = /api {
        set $api_upstream http://api:8090;
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /req-block;
        client_max_body_size 20m;
    }

    location /api/ {
        set $api_upstream http://api:8090;
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Prefix /req-block;
        client_max_body_size 20m;
    }
}
