# Requirement Scratch – self-hosted backend
#
# Usage:
#   cd backend
#   docker compose up -d --build
#
# API:
#   GET  http://localhost:8080/        → project JSON
#   PUT  http://localhost:8080/        → save project JSON
#   GET  http://localhost:8080/health  → health check
#
# In the web app Settings:
#   Remote sync URL = http://YOUR_SERVER:8080/
#   (use https:// behind a reverse proxy in production)

services:
  requirements-api:
    build: .
    image: requirement-scratch-api:latest
    container_name: requirement-scratch-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      DATA_FILE: "/data/project.json"
      # Restrict CORS to your UI origin in production, e.g.:
      # CORS_ORIGIN: "https://requirements.example.com"
      CORS_ORIGIN: "*"
      # Optional basic auth (leave empty to disable):
      # BASIC_AUTH_USER: "team"
      # BASIC_AUTH_PASSWORD: "change-me"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
    volumes:
      - requirements_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  requirements_data:
