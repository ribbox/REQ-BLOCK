# Requirement Scratch – self-hosted backend (API only)
#
#   cd backend && docker compose up -d --build
#
# API on host port 8090 (does NOT use 8080):
#   GET/PUT http://localhost:8090/
#   GET     http://localhost:8090/health
#
# Settings → Remote sync URL = http://YOUR_SERVER:8090/

services:
  requirements-api:
    build: .
    image: requirement-scratch-api:latest
    container_name: requirement-scratch-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
      DATA_FILE: "/data/project.json"
      CORS_ORIGIN: "*"
      BASIC_AUTH_USER: "${BASIC_AUTH_USER:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
    volumes:
      - requirements_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  requirements_data:
